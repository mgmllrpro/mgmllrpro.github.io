# One entry per article series.
# visible: true  -> the series appears on the start page
# visible: false -> prepared, but not yet shown
#
# The id must match the folder name and the "series" value
# in the front matter of every article of that series.

- id: agentic-operating-model
  title: "Agentic Operating Model"
  description: >-
    How organisations move from a human-only operating model to one in which
    people, agents, automation and systems share the work – with accountability
    staying with people.
  url: /agentic-operating-model/
  visible: true
  # Table of contents on the series page. A part links to its article once the article is
  # published (same series and part); until then it shows "Coming soon". minutes: reading time.
  # sections (optional): groups parts, each with a stage pill, a title and a short entry text (Markdown).
  sections:
    - stage: Why
      title: Why it matters
      parts: [1, 2]
      intro: >-
        Most agent programmes start with a list of agents – and get stuck in pilots. These two parts
        explain why the better starting point is what the organisation must be able to do, and what
        becomes scarce once agents make execution cheap. No prior knowledge needed.
    - stage: What
      title: What changes
      parts: [3, 4, 5]
      intro: |
        If you are starting here, three ideas from the first two parts are enough:

        - Start from **capabilities** – what the organisation must reliably be able to do – not from a list of agents.
        - When agents make execution cheap, the bottleneck moves to **decisions, assurance, knowledge and proof**.
        - Work is shared between **people, agents, automation and systems** – and accountability always stays with people.

        These three parts show how work is redesigned, how the organisation is built around it, and how autonomy is earned.
    - stage: How
      title: How it works
      parts: [6, 7]
      intro: |
        These two parts turn the model into architecture and platform. The terms you need:

        - **Capability and outcome** – an ability the organisation needs in many processes, and the result it delivers in each case.
        - **Seven decisions** – every step of today's work is kept, reinterpreted, automated, given to an agent or a person, eliminated, or turned into evidence.
        - **Autonomy levels** – set per action, from *inform* to *supervised autonomy*, and earned with evidence.
        - **Evidence-by-design** – proof created while the work happens, not assembled afterwards.
  parts:
    - part: 1
      title: "Which Agents Should We Build? Why It's the Wrong Question"
      teaser: Why agentic transformation starts with capabilities, not with a list of agents.
      audience: executives and strategy
      minutes: 6
    - part: 2
      title: "Execution Gets Cheap: What Shifts Strategically"
      teaser: What becomes scarce when agents make execution cheap – and what stays hard to copy.
      audience: executives and strategy
      minutes: 7
    - part: 3
      title: "Capabilities, Not Processes: Re-implement, Don't Just Automate"
      teaser: The difference between a process and a capability, and seven decisions for every step.
      audience: operations and process owners
      minutes: 8
    - part: 4
      title: "The Model and the People: Six Building Blocks, and Agents in the Organisation"
      teaser: The six building blocks of the model, and agents integrated like employees without being employees.
      audience: organisation and HR
      minutes: 7
    - part: 5
      title: "Autonomy Is Earned: Governance, Controls and Regulation as a Design Input"
      teaser: Autonomy set per action and earned with evidence, controls built into the work.
      audience: risk and compliance
      minutes: 7
    - part: 6
      title: "Making It Work: The Architecture Behind the Model"
      teaser: Who steers the work, where evidence comes from, autonomy as a setting – and testing that never stops.
      audience: IT and architecture
      minutes: 8
    - part: 7
      title: "Building It on Microsoft: Platform, Control Plane and the Path Ahead"
      teaser: How the model and its architecture map onto the Microsoft platform – and the path for each capability.
      audience: IT and architecture
      minutes: 8
  # Standalone articles the series refers to; url is where they will be published.
  related:
    - title: Building agent-ready knowledge
      teaser: Why knowledge is more than data, and how to build the knowledge agents can rely on.
      url: /agentic-operating-model/knowledge/
    - title: Roles and personas
      teaser: How roles change when agents join the team – from case handler to agent owner.
      url: /agentic-operating-model/personas/

