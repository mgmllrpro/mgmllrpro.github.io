# One entry per article series.
# visible: true  -> the series appears on the start page
# visible: false -> prepared, but not yet shown
#
# The id must match the folder name and the "series" value
# in the front matter of every article of that series.

- id: agentic-operating-model
  title: "Agentic Operating Model"
  description: >-
    How organisations move from a human-only operating model to one in which
    people, agents, automation and systems share the work – with accountability
    staying with people.
  url: /agentic-operating-model/
  visible: true
  # Table of contents on the series page. A part links to its article once the article is
  # published (same series and part); until then it shows "Coming soon". minutes: reading time.
  parts:
    - part: 1
      title: "Which Agents Should We Build? Why It's the Wrong Question"
      teaser: Why agentic transformation starts with capabilities, not with a list of agents.
      audience: executives and strategy
      minutes: 6
    - part: 2
      title: "Execution Gets Cheap: What Shifts Strategically"
      teaser: What becomes scarce when agents make execution cheap – and what stays hard to copy.
      audience: executives and strategy
      minutes: 6
    - part: 3
      title: "Capabilities, Not Processes: Re-implement, Don't Just Automate"
      teaser: The difference between a process and a capability, and seven decisions for every step.
      audience: operations and process owners
      minutes: 8
    - part: 4
      title: "The Model and the People: Six Building Blocks, and Agents in the Organisation"
      teaser: The six building blocks of the model, and agents integrated like employees without being employees.
      audience: organisation and HR
      minutes: 6
    - part: 5
      title: "Autonomy Is Earned: Governance, Controls and Regulation as a Design Input"
      teaser: Autonomy set per action and earned with evidence, controls built into the work.
      audience: risk and compliance
      minutes: 6
    - part: 6
      title: "Building It on Microsoft: Architecture, Control Plane and the Path Ahead"
      teaser: How the model maps onto the Microsoft platform – and the path, one capability at a time.
      audience: IT and architecture
      minutes: 6
  # Standalone articles the series refers to; url is where they will be published.
  related:
    - title: Building agent-ready knowledge
      teaser: Why knowledge is more than data, and how to build the knowledge agents can rely on.
      url: /agentic-operating-model/knowledge/
    - title: Roles and personas
      teaser: How roles change when agents join the team – from case handler to agent owner.
      url: /agentic-operating-model/personas/

- id: cyber-resilience
  title: "Cyber Resilience"
  description: >-
    Cyber resilience for financial institutions in a time of AI-driven threats.
  url: /cyber-resilience/
  visible: false
